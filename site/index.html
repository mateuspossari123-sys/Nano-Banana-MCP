<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jovens Renovados · Comunidade SIM</title>
<meta name="description" content="Fotos dos retiros e grupos de oração do Jovens Renovados, grupo de jovens da Comunidade SIM.">
<link rel="icon" href="assets/logo-simbolo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #15101c;
    color: #fff;
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
  }
  ::selection { background: #2E2E80; color: #fff; }
  a { color: inherit; }
  button { font-family: inherit; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

  .stripe { display: flex; height: 6px; }
  .stripe > div { flex: 1; }

  header.site-header {
    position: sticky; top: 0; z-index: 100;
    background: #0d0d0f;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; color: inherit; padding: 0; }
  .brand img { height: 38px; width: auto; }
  .brand span { font-family: 'Archivo Black', sans-serif; font-size: 20px; letter-spacing: 0.5px; text-transform: uppercase; }

  nav.main-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .nav-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 8px 14px; font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
    text-transform: uppercase; cursor: pointer; color: #fff;
  }
  .nav-btn:hover { color: #ffd400; }
  .nav-btn.active { border-bottom-color: #ffd400; color: #ffd400; }
  .nav-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 6px; }
  .social-link { color: #fff; display: flex; }
  .social-link:hover { color: #ffd400; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }

  .hero { padding: 72px 32px 40px; max-width: 1200px; margin: 0 auto; position: relative; }
  .hero-deco { position: absolute; top: 20px; right: 6vw; width: clamp(56px,9vw,110px); height: auto; transform: rotate(14deg); opacity: 0.9; pointer-events: none; }
  .hero h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(38px,7vw,84px); line-height: 0.98; text-transform: uppercase; margin: 0 0 20px; }
  .hero .highlight { position: relative; display: inline-block; }
  .hero .highlight svg { position: absolute; left: -2%; bottom: -0.12em; width: 104%; height: 0.3em; }
  .hero p { max-width: 560px; font-size: 18px; line-height: 1.5; color: #b3b3b8; margin: 0; }

  .filters { padding: 0 32px 24px; max-width: 1200px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px; font-weight: 700; font-size: 13px; letter-spacing: 0.3px; text-transform: uppercase;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff;
  }
  .filter-btn.active { border-color: transparent; background: #ffd400; color: #0d0d0f; }

  .grid { padding: 0 32px 88px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 22px; }
  .card { background: #1f1826; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; flex-direction: column; }
  .card:hover { border-color: rgba(255,255,255,0.35); }
  .card-body { padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 10px; }
  .badge { align-self: flex-start; padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .card-body h3 { font-family: 'Archivo Black', sans-serif; font-size: 20px; text-transform: uppercase; margin: 0; line-height: 1.15; }
  .meta { font-size: 13px; color: #9a9a9f; }

  .ph { width: 100%; height: 210px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-direction: column; background: #241b2c; color: #6f6f75; }
  .ph svg { opacity: 0.6; }
  .ph span { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }

  .page { padding: 72px 32px 24px; margin: 0 auto; }
  .page h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(34px,5vw,56px); text-transform: uppercase; margin: 0 0 24px; }
  .page p { font-size: 17px; line-height: 1.6; color: #d4d4d8; margin: 0 0 16px; }

  .pillars, .formation-grid { display: grid; gap: 18px; }
  .pillars { grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); }
  .formation-grid { grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 18px 22px; }
  .pillar-card { background: #1f1826; border: 1px solid rgba(255,255,255,0.1); border-top: 4px solid; padding: 22px 20px; }
  .pillar-card h3 { font-family: 'Archivo Black', sans-serif; font-size: 18px; text-transform: uppercase; margin: 0 0 10px; }
  .pillar-card p { font-size: 14px; line-height: 1.5; color: #9a9a9f; margin: 0; }
  .formation-card { background: #1f1826; border: 1px solid rgba(255,255,255,0.1); padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
  .formation-card h3 { font-family: 'Archivo Black', sans-serif; font-size: 17px; text-transform: uppercase; margin: 0; }
  .formation-card p { font-size: 14px; line-height: 1.5; color: #9a9a9f; margin: 0; }

  .back-btn { display: block; background: transparent; border: none; color: #9a9a9f; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; padding: 0 0 24px; }
  .back-btn:hover { color: #fff; }
  .evento-header h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(30px,5vw,52px); text-transform: uppercase; margin: 0 0 10px; line-height: 1.02; }

  .photo-grid { padding: 16px 32px 88px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 16px; }
  .photo-card { position: relative; cursor: pointer; background: #1f1826; border: 1px solid rgba(255,255,255,0.1); }
  .photo-card:hover { border-color: rgba(255,255,255,0.35); }
  .like-badge { position: absolute; bottom: 8px; right: 8px; display: flex; align-items: center; gap: 6px; background: rgba(13,13,15,0.82); padding: 6px 10px; cursor: pointer; }
  .like-badge span { font-size: 12px; font-weight: 700; color: #fff; }

  .lightbox { position: fixed; inset: 0; z-index: 1000; background: rgba(6,6,7,0.94); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; animation: fadeIn 0.18s ease-out; }
  .lightbox-close { position: absolute; top: 24px; right: 28px; background: transparent; border: none; color: #fff; font-size: 28px; line-height: 1; cursor: pointer; font-family: 'Archivo Black', sans-serif; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #fff; font-size: 36px; cursor: pointer; padding: 12px; }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  .lightbox-media { width: min(80vw,900px); height: min(65vh,600px); animation: scaleIn 0.18s ease-out; }
  .lightbox-controls { display: flex; align-items: center; gap: 18px; margin-top: 20px; }
  .lightbox-like { display: flex; align-items: center; gap: 8px; cursor: pointer; background: #1f1826; border: 1px solid rgba(255,255,255,0.15); padding: 9px 16px; }
  .lightbox-like span { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .lightbox-position { font-size: 13px; color: #9a9a9f; letter-spacing: 0.3px; }

  footer.site-footer { border-top: 1px solid rgba(255,255,255,0.1); padding: 28px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .footer-logos { display: flex; align-items: center; gap: 18px; }
  .footer-logos img { opacity: 0.85; }
  .footer-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.2); }
  .footer-text { color: #6f6f75; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  var CAT_STYLE = {
    'RETIRO': { bg: '#2E2E80', color: '#ffffff' },
    'GRUPO DE ORAÇÃO': { bg: '#ffd400', color: '#0d0d0f' },
  };

  function photoIds(id, n) {
    return Array.from({ length: n }, function (_, i) { return id + '-' + (i + 1); });
  }

  var EVENTS_RAW = [
    { id: 'oson-2025', category: 'RETIRO', title: 'OSON 2025', date: '2025', location: 'Chácara Monte Sião', n: 6 },
    { id: 'conferencia-jr-2026', category: 'RETIRO', title: 'CONFERÊNCIA JR 2026', date: '2026', location: 'Casa de Retiros Betânia', n: 5 },
    { id: 'sede-santo-junho', category: 'GRUPO DE ORAÇÃO', title: 'SEDE SANTO JUNHO', date: 'JUNHO', location: 'Salão Paroquial', n: 4 },
  ].map(function (ev) {
    return Object.assign({}, ev, {
      photos: photoIds(ev.id, ev.n),
      catBg: CAT_STYLE[ev.category].bg,
      catColor: CAT_STYLE[ev.category].color,
    });
  });

  var BASE_COUNTS = [34, 12, 58, 7, 21, 45, 9, 63, 28, 15, 40, 19, 52, 6];

  function seedLikes() {
    var likes = {};
    var i = 0;
    EVENTS_RAW.forEach(function (ev) {
      ev.photos.forEach(function (pid) {
        likes[pid] = { liked: false, count: BASE_COUNTS[i % BASE_COUNTS.length] };
        i++;
      });
    });
    return likes;
  }

  var FILTERS = ['TODOS', 'RETIRO', 'GRUPO DE ORAÇÃO'];

  var FORMATION_ITEMS = [
    { tag: 'CURSO', bg: '#2E2E80', color: '#fff', title: 'ESCOLA DE LIDERANÇA JOVEM', desc: 'Formação para quem quer servir e liderar dentro do grupo, com encontros mensais sobre fé, gestão e testemunho.' },
    { tag: 'MATERIAL', bg: '#ffd400', color: '#0d0d0f', title: 'SANTO DO MÊS', desc: 'Toda mês a gente conhece a vida de um santo e o que ele tem pra ensinar pra nossa geração.' },
    { tag: 'MATERIAL', bg: '#ff6a3d', color: '#fff', title: 'CATEQUESE JOVEM', desc: 'Conteúdo de apoio pra quem está se preparando pros sacramentos.' },
  ];

  var PILLARS = [
    { title: 'ADORAÇÃO', color: '#2E2E80', desc: 'A base de tudo. Sem adoração não tem grupo, não tem missão, não tem nada.' },
    { title: 'COMUNIDADE', color: '#ffd400', desc: 'Ninguém caminha sozinho. A gente cresce junto, erra junto e comemora junto.' },
    { title: 'MISSÃO', color: '#ff6a3d', desc: 'Nossa missão é evangelizar, é viver o amor, nosso SIM proclamar.' },
  ];

  var state = {
    page: 'home',
    filter: 'TODOS',
    activeEventId: null,
    lightboxIndex: null,
    likes: seedLikes(),
  };

  function setState(patch) {
    Object.assign(state, typeof patch === 'function' ? patch(state) : patch);
    render();
  }

  function getActiveEvent() {
    return EVENTS_RAW.find(function (e) { return e.id === state.activeEventId; }) || null;
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function heartIcon(liked, size) {
    var fill = liked ? '#ff6a3d' : 'none';
    var stroke = liked ? '#ff6a3d' : '#fff';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9.2C.5 8.4 2 4.5 6 4c2.2-.3 3.8 1 6 3.4C14.2 5 15.8 3.7 18 4c4 .5 5.5 4.4 4 7.8C19.5 16.4 12 21 12 21z"></path></svg>';
  }

  function placeholder(label) {
    return '<div class="ph">' +
      '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M3 17l5-5 4 4 3-3 6 6"></path></svg>' +
      '<span>' + esc(label) + '</span></div>';
  }

  function renderStripe() {
    return '<div class="stripe"><div style="background:#2E2E80"></div><div style="background:#ffd400"></div><div style="background:#ff6a3d"></div></div>';
  }

  function renderHeader() {
    var navItems = [
      { key: 'home', label: 'HOME' },
      { key: 'sobre', label: 'SOBRE' },
      { key: 'formacao', label: 'FORMAÇÃO' },
    ].map(function (it) {
      var active = state.page === it.key;
      return '<button class="nav-btn' + (active ? ' active' : '') + '" data-action="nav" data-page="' + it.key + '">' + it.label + '</button>';
    }).join('');

    return '' +
      '<header class="site-header">' +
      '<button class="brand" data-action="nav" data-page="home">' +
      '<img src="assets/logo-simbolo.png" alt="Jovens Renovados">' +
      '<span>Jovens Renovados</span>' +
      '</button>' +
      '<nav class="main-nav">' + navItems +
      '<div class="nav-divider"></div>' +
      '<a class="social-link" href="https://www.instagram.com/jovensrenovados_sim/" target="_blank" rel="noopener" aria-label="Instagram">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>' +
      '</a>' +
      '<a class="social-link" href="https://www.youtube.com/@sim_dracena" target="_blank" rel="noopener" aria-label="YouTube">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"></path></svg>' +
      '</a>' +
      '</nav>' +
      '</header>';
  }

  function renderHome() {
    var filters = FILTERS.map(function (f) {
      var active = state.filter === f;
      return '<button class="filter-btn' + (active ? ' active' : '') + '" data-action="filter" data-filter="' + esc(f) + '">' + esc(f) + '</button>';
    }).join('');

    var filtered = EVENTS_RAW.filter(function (ev) {
      return state.filter === 'TODOS' || ev.category === state.filter;
    });

    var cards = filtered.map(function (ev) {
      return '' +
        '<div class="card" data-action="open-event" data-id="' + ev.id + '">' +
        placeholder('Foto de capa') +
        '<div class="card-body">' +
        '<span class="badge" style="background:' + ev.catBg + ';color:' + ev.catColor + '">' + esc(ev.category) + '</span>' +
        '<h3>' + esc(ev.title) + '</h3>' +
        '<span class="meta">' + esc(ev.date) + ' · ' + esc(ev.location) + '</span>' +
        '</div></div>';
    }).join('');

    return '' +
      '<section class="hero">' +
      '<img class="hero-deco" src="assets/logo-simbolo.png" alt="">' +
      '<h1>AS FOTOS DOS<br>NOSSOS <span class="highlight">ENCONTROS' +
      '<svg viewBox="0 0 300 24" preserveAspectRatio="none"><path d="M2 14 C 60 4, 240 4, 298 12" stroke="#ffd400" stroke-width="10" fill="none" stroke-linecap="round"></path></svg>' +
      '</span></h1>' +
      '<p>Retiros e grupos de oração — os melhores momentos da nossa juventude, registrados pra ninguém esquecer.</p>' +
      '</section>' +
      '<section class="filters">' + filters + '</section>' +
      '<section class="grid">' + cards + '</section>';
  }

  function renderSobre() {
    var pillars = PILLARS.map(function (p) {
      return '' +
        '<div class="pillar-card" style="border-top-color:' + p.color + '">' +
        '<h3>' + esc(p.title) + '</h3>' +
        '<p>' + esc(p.desc) + '</p>' +
        '</div>';
    }).join('');

    return '' +
      '<section class="page" style="max-width:820px">' +
      '<h1>QUEM SOMOS</h1>' +
      '<p>O Jovens Renovados é um grupo de jovens vinculado à comunidade SIM, sediada em Dracena. Sua missão é evangelizar jovens, proporcionando-lhes uma experiência profunda de encontro com o Espírito Santo, além de auxiliar em sua formação pessoal e espiritual.</p>' +
      '<p>Entre as atividades promovidas, destaca-se o retiro "Ou Santo ou Nada", principal evento do grupo, realizado em Dracena e que já reuniu mais de 2.000 participantes.</p>' +
      '<p style="font-size:15px;color:#9a9a9f;margin-bottom:48px">Site oficial da comunidade SIM: <a href="https://www.redesim.com.br/" target="_blank" rel="noopener" style="color:#ffd400;text-decoration:underline">redesim.com.br</a></p>' +
      '<div class="pillars">' + pillars + '</div>' +
      '</section>';
  }

  function renderFormacao() {
    var items = FORMATION_ITEMS.map(function (it) {
      return '' +
        '<div class="formation-card">' +
        '<span class="badge" style="background:' + it.bg + ';color:' + it.color + '">' + esc(it.tag) + '</span>' +
        '<h3>' + esc(it.title) + '</h3>' +
        '<p>' + esc(it.desc) + '</p>' +
        '</div>';
    }).join('');

    return '' +
      '<section class="page" style="max-width:1000px">' +
      '<h1>FORMAÇÃO</h1>' +
      '<p style="max-width:640px;margin-bottom:40px">Além das fotos, aqui tem conteúdo pra quem quer crescer na fé de verdade.</p>' +
      '<div class="formation-grid">' + items + '</div>' +
      '</section>';
  }

  function renderEvento() {
    var ev = getActiveEvent();
    if (!ev) return '';
    var photos = ev.photos.map(function (pid, index) {
      var like = state.likes[pid];
      return '' +
        '<div class="photo-card" data-action="open-lightbox" data-index="' + index + '">' +
        placeholder('Foto do evento') +
        '<div class="like-badge" data-action="toggle-like" data-id="' + pid + '">' +
        heartIcon(like.liked, 15) +
        '<span>' + like.count + '</span>' +
        '</div></div>';
    }).join('');

    return '' +
      '<section class="page evento-header" style="max-width:1200px;padding-top:40px">' +
      '<button class="back-btn" data-action="nav" data-page="home">← VOLTAR</button>' +
      '<span class="badge" style="background:' + ev.catBg + ';color:' + ev.catColor + ';display:inline-block;margin-bottom:14px">' + esc(ev.category) + '</span>' +
      '<h1>' + esc(ev.title) + '</h1>' +
      '<span class="meta">' + esc(ev.date) + ' · ' + esc(ev.location) + '</span>' +
      '</section>' +
      '<section class="photo-grid">' + photos + '</section>';
  }

  function renderLightbox() {
    var ev = getActiveEvent();
    var open = ev != null && state.lightboxIndex != null;
    if (!open) return '';
    var pid = ev.photos[state.lightboxIndex];
    var like = state.likes[pid];
    var position = (state.lightboxIndex + 1) + ' / ' + ev.photos.length;

    return '' +
      '<div class="lightbox">' +
      '<button class="lightbox-close" data-action="close-lightbox">×</button>' +
      '<button class="lightbox-nav lightbox-prev" data-action="prev-photo">‹</button>' +
      '<button class="lightbox-nav lightbox-next" data-action="next-photo">›</button>' +
      '<div class="lightbox-media">' + placeholder('Foto do evento') + '</div>' +
      '<div class="lightbox-controls">' +
      '<div class="lightbox-like" data-action="toggle-lightbox-like">' +
      heartIcon(like.liked, 18) +
      '<span>' + like.count + ' curtidas</span>' +
      '</div>' +
      '<span class="lightbox-position">' + position + '</span>' +
      '</div></div>';
  }

  function renderFooter() {
    return '' +
      '<footer class="site-footer">' +
      '<div class="footer-logos">' +
      '<img src="assets/logo-simbolo.png" alt="Jovens Renovados" height="32">' +
      '<div class="footer-divider"></div>' +
      '<img src="assets/logo-sim-branco.png" alt="Comunidade SIM" height="26">' +
      '</div>' +
      '<span class="footer-text">JOVENS RENOVADOS · COMUNIDADE SIM</span>' +
      '</footer>';
  }

  function render() {
    var page = state.page;
    var main = '';
    if (page === 'home') main = renderHome();
    else if (page === 'sobre') main = renderSobre();
    else if (page === 'formacao') main = renderFormacao();
    else if (page === 'evento') main = renderEvento();

    var root = document.getElementById('root');
    root.innerHTML = '' +
      '<div>' +
      renderStripe() +
      renderHeader() +
      main +
      renderFooter() +
      renderLightbox() +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'nav') {
      setState({ page: el.getAttribute('data-page'), lightboxIndex: null });
    } else if (action === 'filter') {
      setState({ filter: el.getAttribute('data-filter') });
    } else if (action === 'open-event') {
      setState({ page: 'evento', activeEventId: el.getAttribute('data-id'), lightboxIndex: null });
      window.scrollTo(0, 0);
    } else if (action === 'open-lightbox') {
      setState({ lightboxIndex: parseInt(el.getAttribute('data-index'), 10) });
    } else if (action === 'close-lightbox') {
      setState({ lightboxIndex: null });
    } else if (action === 'prev-photo') {
      var evP = getActiveEvent();
      if (evP) setState(function (s) { return { lightboxIndex: (s.lightboxIndex - 1 + evP.photos.length) % evP.photos.length }; });
    } else if (action === 'next-photo') {
      var evN = getActiveEvent();
      if (evN) setState(function (s) { return { lightboxIndex: (s.lightboxIndex + 1) % evN.photos.length }; });
    } else if (action === 'toggle-like') {
      var id = el.getAttribute('data-id');
      setState(function (s) {
        var cur = s.likes[id];
        var liked = !cur.liked;
        var likes = Object.assign({}, s.likes);
        likes[id] = { liked: liked, count: cur.count + (liked ? 1 : -1) };
        return { likes: likes };
      });
    } else if (action === 'toggle-lightbox-like') {
      var evL = getActiveEvent();
      if (evL && state.lightboxIndex != null) {
        var pidL = evL.photos[state.lightboxIndex];
        setState(function (s) {
          var cur = s.likes[pidL];
          var liked = !cur.liked;
          var likes = Object.assign({}, s.likes);
          likes[pidL] = { liked: liked, count: cur.count + (liked ? 1 : -1) };
          return { likes: likes };
        });
      }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (state.lightboxIndex == null) return;
    if (e.key === 'Escape') setState({ lightboxIndex: null });
    else if (e.key === 'ArrowLeft') {
      var evP = getActiveEvent();
      if (evP) setState(function (s) { return { lightboxIndex: (s.lightboxIndex - 1 + evP.photos.length) % evP.photos.length }; });
    } else if (e.key === 'ArrowRight') {
      var evN = getActiveEvent();
      if (evN) setState(function (s) { return { lightboxIndex: (s.lightboxIndex + 1) % evN.photos.length }; });
    }
  });

  render();
})();
</script>
</body>
</html>
